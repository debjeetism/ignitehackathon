services:
  # Backend API Service
  - type: web
    name: ignite-agent-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false
      - key: NEO4J_TRUST_ALL_CERTIFICATES
        value: "false"
      - key: IGNITE_DATA_DIR
        value: /tmp/ignite-agent
      - key: IGNITE_STATE_DB
        value: /tmp/ignite-agent/ignite-state.db
      - key: CORS_ORIGINS
        value: '["*"]'

  # Frontend Static Site
  - type: web
    name: ignite-agent-web
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: VITE_API_URL
        value: https://ignite-agent-api.onrender.com
